name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy after build?"
        required: true
        type: boolean
        default: false
jobs:
   build:
    runs-on: ubuntu-latest

    steps:
      - name: Show version
        run: echo "Deploy = ${{ inputs.deploy || false }}"
        
      - name: Build
        run: echo "Building..."

      - name: Deploy
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy == true }}
        run: echo "Deploying..."
   deploy:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy == true }}
    needs: build
    runs-on: ubuntu-latest
  
    steps:
      - name: Deploy
        run: echo "Deploying..."
