name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy after build?"
        required: true
        type: boolean
        default: false
jobs:
   build:
    runs-on: ubuntu-latest

    steps:
      - name: Show version
        run: echo "Deploy = ${{ inputs.deploy || false }}"
        
      - name: Build
        run: echo "Building..."
        
      - name: Get ResourceBase version
        id: version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "ResourceBase version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          
      - name: trigger
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy == true }}
        env:
          GH_TOKEN: ${{ secrets.STUDENT_TRIGGER_TOKEN }}
          RESOURCEBASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
           echo "Sending version: $RESOURCEBASE_VERSION"
           curl --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Rahu00001/Java_GitHub_Action/dispatches \
            -d "{
              \"event_type\": \"resource-base-updated\",
              \"client_payload\": {
                \"resource_base_version\": \"$RESOURCEBASE_VERSION\"
              }
            }"
   trigger:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy == true }}
    needs: build
    runs-on: ubuntu-latest
  
    steps:
      - name: Deploy
        run: echo "Deploying..."
